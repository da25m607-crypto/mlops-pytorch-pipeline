apiVersion: batch/v1
kind: Job
metadata:
  name: model-training
  namespace: ml-training
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: model-training
    spec:
      restartPolicy: Never
      containers:
        - name: train
          image: mlops-train:v1
          imagePullPolicy: IfNotPresent
          env:
            - name: TRAINING_CONFIG
              value: /app/configs/training_config.yaml
            - name: OMP_NUM_THREADS 
              value: "2"
            - name: MKL_NUM_THREADS 
              value: "2"
          volumeMounts:
            - name: config-volume
              mountPath: /app/configs
            - name: data-volume
              mountPath: /app/data
            - name: checkpoint-volume
              mountPath: /app/checkpoints
          resources:
            requests:
              cpu: "1500m"
              memory: "4Gi"
            limits:
              cpu: "1500m"
              memory: "4Gi"
          # --- Bonus (5 pts): GPU scheduling ---
          # Uncomment to request a GPU and pin the pod to a GPU-labeled node.
          # resources:
          #   requests:
          #     cpu: "2"
          #     memory: "4Gi"
          #     nvidia.com/gpu: 1
          #   limits:
          #     cpu: "2"
          #     memory: "4Gi"
          #     nvidia.com/gpu: 1
      # nodeSelector:
      #   accelerator: nvidia-gpu
      # tolerations:
      #   - key: "nvidia.com/gpu"
      #     operator: "Exists"
      #     effect: "NoSchedule"
      volumes:
        - name: config-volume
          configMap:
            name: training-config
        - name: data-volume
          persistentVolumeClaim:
            claimName: dataset-pvc
        - name: checkpoint-volume
          persistentVolumeClaim:
            claimName: checkpoint-pvc
