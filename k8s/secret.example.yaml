# Template only — copy to secret.yaml (already .gitignored) and fill in
# real values locally, or better, create the Secret imperatively so no
# plaintext secret ever touches git history:
#
#   kubectl create secret generic serving-secrets \
#     --namespace ml-training \
#     --from-literal=MODEL_REGISTRY_TOKEN=<token> \
#     --from-literal=WANDB_API_KEY=<key>
#
# This file is committed (it has no real values) purely to document the
# expected keys; secret.yaml itself is in .gitignore.
apiVersion: v1
kind: Secret
metadata:
  name: serving-secrets
  namespace: ml-training
type: Opaque
stringData:
  MODEL_REGISTRY_TOKEN: "REPLACE_ME"
  WANDB_API_KEY: "REPLACE_ME"
